name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch PR base for LOC allowlist check
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Enforce Rust file length
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            scripts/check_loc.sh FETCH_HEAD
          else
            scripts/check_loc.sh
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Download pinned sqlite-vec for contract snapshots
        run: |
          curl --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 180 --retry 2 --retry-delay 2 --retry-all-errors \
            https://github.com/asg017/sqlite-vec/releases/download/v0.1.10-alpha.4/sqlite-vec-0.1.10-alpha.4-loadable-linux-x86_64.tar.gz \
            --output sqlite-vec.tar.gz
          echo "0349d1cffea2da145eb195ee0fa0e7803544a9491a458c58aeacfb434517abf1  sqlite-vec.tar.gz" | sha256sum --check
          mkdir -p sqlite-vec
          tar -xzf sqlite-vec.tar.gz -C sqlite-vec
          cp sqlite-vec/vec0.so vec0.so

      - name: Format check
        run: cargo fmt --check --all

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Type check
        run: cargo check --locked --all-targets

      - name: Build (debug)
        run: cargo build --locked --all-targets

      - name: Provision local embedding model for deterministic tests
        run: target/debug/koala-rust model fetch --to "$RUNNER_TEMP/koala-model"

      - name: Verify CLI, MCP, and SQLite snapshots
        env:
          KOALA_BIN: ${{ github.workspace }}/target/debug/koala-rust
          KOALA_VEC0_PATH: ${{ github.workspace }}/vec0.so
          KOALA_MODEL_DIR: ${{ runner.temp }}/koala-model
        run: python3 tests/snapshot_baseline.py

      - name: End-to-end regression suite
        env:
          KOALA_BIN: ${{ github.workspace }}/target/debug/koala-rust
          KOALA_VEC0_PATH: ${{ github.workspace }}/vec0.so
          KOALA_MODEL_DIR: ${{ runner.temp }}/koala-model
        run: python3 tests/e2e.py

      - name: Python stdio client and adapter integration tests
        env:
          KOALA_BIN: ${{ github.workspace }}/target/debug/koala-rust
          KOALA_VEC0_PATH: ${{ github.workspace }}/vec0.so
          KOALA_MODEL_DIR: ${{ runner.temp }}/koala-model
        run: PYTHONPATH=python python3 -m unittest discover -s python/tests -v

      - name: SQLCipher encryption integration test
        env:
          KOALA_VEC0_PATH: ${{ github.workspace }}/vec0.so
        run: cargo test --locked --no-default-features --features sqlcipher --lib encrypted_database_requires_the_correct_key_and_hides_plaintext

      - name: Test
        env:
          KOALA_MODEL_DIR: ${{ runner.temp }}/koala-model
        run: cargo test --locked --all-targets

      - name: Verify binary
        run: |
          cargo build --locked --release
          ./target/release/koala-rust --help

  offline-build:
    name: Offline Build and Air-Gapped E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download pinned sqlite-vec
        run: |
          curl --fail --location --silent --show-error --connect-timeout 20 --max-time 180 --retry 2 --retry-delay 2 --retry-all-errors https://github.com/asg017/sqlite-vec/releases/download/v0.1.10-alpha.4/sqlite-vec-0.1.10-alpha.4-loadable-linux-x86_64.tar.gz --output sqlite-vec.tar.gz
          echo "0349d1cffea2da145eb195ee0fa0e7803544a9491a458c58aeacfb434517abf1  sqlite-vec.tar.gz" | sha256sum --check
          mkdir -p sqlite-vec
          tar -xzf sqlite-vec.tar.gz -C sqlite-vec
          cp sqlite-vec/vec0.so vec0.so

      - name: Build network-enabled model provisioning CLI
        run: cargo build --locked

      - name: Provision model for offline runtime
        run: target/debug/koala-rust model fetch --to "${{ runner.temp }}/koala-model"

      - name: Build without network support
        run: cargo build --locked --no-default-features

      - name: Assert network clients are absent
        shell: bash
        run: |
          if cargo tree --locked --no-default-features | grep -E '(^|[[:space:]])(reqwest|ureq|hf-hub) v'; then
            echo "network client dependency found in offline build"
            exit 1
          fi

      - name: Run end-to-end test inside an isolated network namespace
        env:
          KOALA_BIN: ${{ github.workspace }}/target/debug/koala-rust
          KOALA_MODEL_DIR: ${{ runner.temp }}/koala-model
          KOALA_VEC0_PATH: ${{ github.workspace }}/vec0.so
        run: bash tests/offline_e2e.sh

      - name: Run unit tests without network support
        env:
          KOALA_MODEL_DIR: ${{ runner.temp }}/koala-model
        run: cargo test --locked --no-default-features --lib

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Audit RustSec advisories
        run: cargo audit

      - name: Check advisories with cargo-deny
        run: cargo deny check advisories

  fuzz:
    name: Fuzz Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz JSON-RPC parser
        run: cargo fuzz run jsonrpc_parser -- -max_total_time=30 -max_len=4096

      - name: Fuzz raw SQL execution
        run: cargo fuzz run raw_sql -- -max_total_time=30 -max_len=512 -timeout=5

  msrv:
    name: MSRV (Rust 1.94)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Check minimum supported Rust
        run: cargo check --locked --all-targets

  cross-check:
    name: Cross-platform Check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install sqlite3 pkg-config

      - name: Install system dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install sqlite

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cross-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cross build check
        if: matrix.use_cross
        run: cross check --locked --target ${{ matrix.target }}

      - name: Native build check
        if: "!matrix.use_cross"
        run: cargo check --locked --target ${{ matrix.target }}
