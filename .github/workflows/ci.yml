name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check --all

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Type check
        run: cargo check --all-targets

      - name: Build (debug)
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

      - name: Verify binary
        run: |
          cargo build --release
          ./target/release/peabrain-rust --help

  cross-check:
    name: Cross-platform Check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install sqlite3 pkg-config

      - name: Install system dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install sqlite

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cross-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cross build check
        if: matrix.use_cross
        run: cross check --target ${{ matrix.target }}

      - name: Native build check
        if: "!matrix.use_cross"
        run: cargo check --target ${{ matrix.target }}