name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: false
        default: 'v0.2.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: peabrain-rust-x86_64-unknown-linux-gnu
            rust_toolchain: stable
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: peabrain-rust-aarch64-unknown-linux-gnu
            rust_toolchain: stable
            cross: true
          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: peabrain-rust-x86_64-apple-darwin
            rust_toolchain: stable
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: peabrain-rust-aarch64-apple-darwin
            rust_toolchain: stable
          # Windows
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            artifact: peabrain-rust-x86_64-pc-windows-gnu.exe
            rust_toolchain: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust_toolchain }}
          target: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsqlite3-dev clang
          # For cross-compilation to ARM64
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi
          # For Windows cross-compilation
          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-gnu" ]]; then
            sudo apt-get install -y mingw-w64
          fi

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sqlite3 pkg-config

      - name: Install cross (for cross-compilation)
        if: matrix.cross == 'true'
        run: cargo install cross --locked

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (native)
        if: matrix.cross != 'true'
        run: |
          cargo build --release --target ${{ matrix.target }}
          ls -la target/${{ matrix.target }}/release/

      - name: Build (cross)
        if: matrix.cross == 'true'
        run: |
          cross build --release --target ${{ matrix.target }}
          ls -la target/${{ matrix.target }}/release/

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp target/${{ matrix.target }}/release/peabrain-rust.exe artifacts/${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/peabrain-rust artifacts/${{ matrix.artifact }}
          fi
          # Verify binary works
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            ./artifacts/${{ matrix.artifact }} --help || true
          else
            chmod +x artifacts/${{ matrix.artifact }}
            ./artifacts/${{ matrix.artifact }} --help || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: (!cancelled()) && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release-assets
          pattern: peabrain-rust-*
          merge-multiple: true

      - name: Check assets
        id: check_assets
        run: |
          mkdir -p release-assets
          count=$(ls -1 release-assets/peabrain-rust-* 2>/dev/null | wc -l)
          echo "Found $count release asset(s)"
          if [ "$count" -eq 0 ]; then
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_assets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: List assets
        if: steps.check_assets.outputs.has_assets == 'true'
        run: |
          ls -la release-assets/

      - name: Generate checksums
        if: steps.check_assets.outputs.has_assets == 'true'
        run: |
          cd release-assets
          sha256sum peabrain-rust-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        if: steps.check_assets.outputs.has_assets == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: peabrain-rust ${{ inputs.tag || github.ref_name }}
          body: |
            ## peabrain-rust ${{ github.ref_name }}

            **Local, private, persistent memory for AI agents** — with semantic search, CRDT sync, real embeddings, and WASM plugin extensibility.

            A single binary (49 MB) that gives any MCP-compatible agent: long-term fact storage, vector search, knowledge graphs, task management, multi-agent synchronization, and a sandboxed plugin system.

            ### 🙏 Attribution

            This project is a **Rust rewrite and evolution** of the original [PeaBrain](https://github.com/akadatalimited/PeaBrain) by [AkaData Limited](https://www.linkedin.com/in/akadatalimited/) — extending it with:
            - Real local embeddings (Candle + all-MiniLM-L6-v2)
            - Vector search (sqlite-vec HNSW)
            - CRDT-based multi-agent sync (VectorClock)
            - WASM/native plugin marketplace (wasmtime + libloading)
            - MCP server with 50 tools
            - Cross-platform releases (Linux/macOS/Windows × x86_64/ARM64)

            ### Installation

            **Binary (recommended):**
            ```bash
            # Linux x86_64
            curl -L https://github.com/dbillion/peabrain-rust/releases/download/${{ github.ref_name }}/peabrain-rust-x86_64-unknown-linux-gnu -o peabrain-rust
            chmod +x peabrain-rust

            # Linux ARM64
            curl -L https://github.com/dbillion/peabrain-rust/releases/download/${{ github.ref_name }}/peabrain-rust-aarch64-unknown-linux-gnu -o peabrain-rust
            chmod +x peabrain-rust

            # macOS x86_64 (Intel)
            curl -L https://github.com/dbillion/peabrain-rust/releases/download/${{ github.ref_name }}/peabrain-rust-x86_64-apple-darwin -o peabrain-rust
            chmod +x peabrain-rust

            # macOS ARM64 (Apple Silicon)
            curl -L https://github.com/dbillion/peabrain-rust/releases/download/${{ github.ref_name }}/peabrain-rust-aarch64-apple-darwin -o peabrain-rust
            chmod +x peabrain-rust

            # Windows x86_64
            curl -L https://github.com/dbillion/peabrain-rust/releases/download/${{ github.ref_name }}/peabrain-rust-x86_64-pc-windows-gnu.exe -o peabrain-rust.exe
            ```

            **Via Cargo:**
            ```bash
            cargo install --git https://github.com/dbillion/peabrain-rust --tag ${{ github.ref_name }}
            ```

            ### Quick Start
            ```bash
            export PEABRAIN_STATE_DIR=~/.peabrain
            ./peabrain-rust --serve
            ```

            ### Verify Downloads
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ### What's New
            See [CHANGELOG](https://github.com/dbillion/peabrain-rust/blob/master/CHANGELOG.md) (if exists) or commit history.

          files: |
            release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-cargo:
    name: Publish to crates.io (optional)
    needs: release
    runs-on: ubuntu-latest
    if: false  # Set to true and add CARGO_REGISTRY_TOKEN secret to enable
    steps:
      - uses: actions/checkout@v4
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}