name: Deploy Documentation

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

# Production deploys (push, manual) share one group and never cancel each other.
# Pull-request builds get their own group per PR, so they can never replace a queued
# deploy. Without this, a Dependabot PR run cancelled the pending master deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-doc:
    name: Build API Reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: |
          sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev clang
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-doc-${{ hashFiles('**/Cargo.lock') }}
      - name: Build rustdoc
        run: |
          cargo doc --lib --no-deps --document-private-items
          mkdir -p target/doc
          cat << 'EOF' > target/doc/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=koala_rust/index.html">
              <title>koala-rust API Documentation</title>
          </head>
          <body>
              <p>Redirecting to <a href="koala_rust/index.html">koala API documentation</a>...</p>
          </body>
          </html>
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: target/doc
          retention-days: 30

  litho-arch:
    name: Build Architecture Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Architecture Docs
        run: |
          mkdir -p docs/architecture
          cat << 'EOF' > docs/architecture/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <title>Koala Architecture</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #24292f; }
                  h1 { color: #0969da; border-bottom: 2px solid #eaecef; padding-bottom: 0.3em; }
                  h2 { color: #1f2328; margin-top: 24px; }
                  code { background: #f6f8fa; padding: 2px 6px; border-radius: 4px; font-size: 85%; }
                  .card { background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; margin: 16px 0; }
                  a { color: #0969da; text-decoration: none; }
                  a:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
              <h1>Koala Architecture Overview</h1>
              <p>Koala is an embedded MCP (Model Context Protocol) server and CLI in Rust offering persistent memory, vector search, CRDT synchronization, local embeddings, and WASM plugin extensibility.</p>
              
              <div class="card">
                  <h2>Core Subsystems</h2>
                  <ul>
                      <li><strong>Database Engine (<code>src/db/</code>)</strong>: SQLite-backed ACID storage for facts, entities, relations, sequential thoughts, and scoring feedback.</li>
                      <li><strong>Vector Engine (<code>src/vector/</code>)</strong>: SQLite-vec integration with HNSW indexing for hybrid and cosine semantic search.</li>
                      <li><strong>Embeddings (<code>src/embeddings/</code>)</strong>: Local on-device embeddings via Model2Vec and potion-base-8M (256 dimensions).</li>
                      <li><strong>Sync Manager (<code>src/sync/</code>)</strong>: Multi-agent state synchronization using Automerge CRDTs.</li>
                      <li><strong>Plugin Host (<code>src/plugins.rs</code>)</strong>: Sandboxed WebAssembly (Wasmtime) and native dynamic library plugin loading.</li>
                      <li><strong>MCP Server (<code>src/mcp/</code>)</strong>: Stdio-based JSON-RPC protocol implementation providing 50+ tools for AI coding assistants.</li>
                  </ul>
              </div>
              <p><a href="../">Back to Documentation Home</a> &bull; <a href="../api/">API Reference</a></p>
          </body>
          </html>
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-docs
          path: docs/architecture
          retention-days: 30

  mdbook:
    name: Build User Guides (mdBook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"
      - name: Build Book
        run: |
          mkdir -p docs/book/src
          cat << 'EOF' > docs/book/book.toml
          [book]
          authors = ["dbillion"]
          language = "en"
          src = "src"
          title = "koala-rust Documentation"

          [output.html]
          git-repository-url = "https://github.com/dbillion/koala-rust"
          EOF
          cat << 'EOF' > docs/book/src/SUMMARY.md
          # Summary

          - [Introduction](README.md)
          - [Quick Start](quickstart.md)
          - [Architecture](architecture.md)
          - [API Reference](api.md)
          EOF
          cp README.md docs/book/src/README.md
          cat << 'EOF' > docs/book/src/quickstart.md
          # Quick Start

          ## Installation
          ```bash
          cargo install --git https://github.com/dbillion/koala-rust
          ```

          ## Starting the MCP Server
          ```bash
          export KOALA_STATE_DIR=~/.koala
          koala-rust --serve
          ```

          ## CLI Commands
          ```bash
          # Write and read facts
          koala-rust fact-write "project_name" "Koala"
          koala-rust fact-read "project_name"

          # Health check
          koala-rust health
          ```
          EOF
          cat << 'EOF' > docs/book/src/architecture.md
          # Architecture

          See the [Full Architecture Documentation](../architecture/) for technical diagrams and subsystem breakdown.
          EOF
          cat << 'EOF' > docs/book/src/api.md
          # API Reference

          The full Rust crate documentation is available at [API Reference](../api/).
          EOF
          cd docs/book && mdbook build
      - uses: actions/upload-artifact@v4
        with:
          name: mdbook-docs
          path: docs/book/book
          retention-days: 30

  deploy:
    name: Deploy to GitHub Pages
    needs: [cargo-doc, litho-arch, mdbook]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://dbillion.github.io/koala-rust/
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: api-docs
          path: deploy/api
      - uses: actions/download-artifact@v8
        with:
          name: architecture-docs
          path: deploy/architecture
      - uses: actions/download-artifact@v8
        with:
          name: mdbook-docs
          path: deploy/book
      - name: Assemble site
        run: |
          mkdir -p deploy/site
          if [ -d deploy/book ]; then
            cp -r deploy/book/* deploy/site/
          fi
          mkdir -p deploy/site/api
          if [ -d deploy/api ]; then
            cp -r deploy/api/* deploy/site/api/
          fi
          mkdir -p deploy/site/architecture
          if [ -d deploy/architecture ]; then
            cp -r deploy/architecture/* deploy/site/architecture/
          fi
          if [ ! -f deploy/site/index.html ]; then
            printf '%s\n' '<!DOCTYPE html>' '<html>' '<head><meta charset="utf-8"><title>koala-rust Documentation</title></head>' '<body><h1>koala-rust Documentation</h1><ul><li><a href="api/">API Reference</a></li><li><a href="architecture/">Architecture Overview</a></li></ul></body></html>' > deploy/site/index.html
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          # Avoid duplicate github-pages artifacts when a failed run is retried.
          name: github-pages-${{ github.run_attempt }}
          path: deploy/site
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            artifact_visible="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts | any(.name == env.EXPECTED_ARTIFACT)' 2>/dev/null || true)"
            if [[ "$artifact_visible" == "true" ]]; then
              echo "Pages artifact $EXPECTED_ARTIFACT is visible to the deployment API"
              exit 0
            fi
            echo "Waiting for Pages artifact metadata ($attempt/12)..."
            sleep 5
          done
          echo "::error::Pages artifact $EXPECTED_ARTIFACT was uploaded but never became visible to the deployment API" >&2
          exit 1
      - uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
