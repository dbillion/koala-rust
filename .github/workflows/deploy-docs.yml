name: Deploy Documentation

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-doc:
    name: Build API Reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: |
          sudo -S -p '' apt-get update && sudo -S -p '' apt-get install -y pkg-config libsqlite3-dev clang
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-doc-${{ hashFiles('**/Cargo.lock') }}
      - run: |
          # Move test file completely out of workspace
          mv test_load_wasm.rs /tmp/test_load_wasm.rs.bak 2>/dev/null || true
          cargo doc --no-deps --document-private-items
          crate_name=$(grep '^name =' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "<meta http-equiv=refresh content=0;url=$crate_name/> > target/doc/index.html
          mv /tmp/test_load_wasm.rs.bak test_load_wasm.rs 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: target/doc
          retention-days: 30

  litho-arch:
    name: Build Architecture Docs (Litho)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev clang
      - run: |
          cargo install deepwiki-rs --locked
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - run: |
          cat > litho.toml << 'EOF'
          [project]
          name = "koala-rust"
          root = "."
          [output]
          dir = "docs/architecture"
          format = "markdown"
          [analysis]
          include_patterns = ["src/**/*.rs"]
          exclude_patterns = ["target/**", "tests/**", "examples/**", "plugins/**"]
          [diagrams]
          c4_context = true
          c4_container = true
          c4_component = true
          c4_code = true
          mermaid = true
          max_depth = 3
          [llm]
          provider = "local"
          model = "code-analysis"
          EOF
      - run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          litho generate
          ls -la docs/architecture/
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-docs
          path: docs/architecture
          retention-days: 30

  mdbook:
    name: Build User Guides (mdBook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"
      - run: |
          if [ ! -f "book.toml" ]; then
            mdbook init --title "koala-rust Documentation" .
          fi
      - run: |
          mkdir -p src
          if [ ! -f "src/SUMMARY.md" ]; then
            printf "%s\n" \
              "# Summary" \
              "" \
              "- [Introduction](README.md)" \
              "- [Quick Start](quickstart.md)" \
              > src/SUMMARY.md
          fi
      - run: mdbook build
      - uses: actions/upload-artifact@v4
        with:
          name: mdbook-docs
          path: book
          retention-days: 30

  deploy:
    name: Deploy to GitHub Pages
    needs: [cargo-doc, litho-arch, mdbook]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://dbillion.github.io/koala-rust/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-docs
          path: deploy/api
      - uses: actions/download-artifact@v4
        with:
          name: architecture-docs
          path: deploy/architecture
      - uses: actions/download-artifact@v4
        with:
          name: mdbook-docs
          path: deploy/book
      - run: |
          mkdir -p deploy/site
          cp -r deploy/book/* deploy/site/
          mkdir -p deploy/site/api
          cp -r deploy/api/* deploy/site/api/
          mkdir -p deploy/site/architecture
          cp -r deploy/architecture/* deploy/site/architecture/
          if [ ! -f deploy/site/index.html ]; then
            printf "%s\n" \
              "<!DOCTYPE html>" \
              "<html>" \
              "<head>" \
              "    <meta charset=\"utf-8\">" \
              "    <meta http-equiv=\"refresh\" content=\"0; url=./\">" \
              "    <title>koala-rust Documentation</title>" \
              "</head>" \
              "<body>" \
              "    <p>Redirecting to <a href=\"./\">koala-rust Documentation</a>...</p>" \
              "</body>" \
              "</html>" \
              > deploy/site/index.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/site
      - uses: actions/deploy-pages@v4
