version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Wait 14 days after a release before proposing it (supply-chain safety).
    # Security updates ignore the cooldown, so urgent fixes still arrive at once.
    cooldown:
      default-days: 14
    groups:
      rust-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    # ci.yml pins the MSRV job as dtolnay/rust-toolchain@1.94.0. That tag is a Rust
    # version, not a dependency, so bumping it silently changes the MSRV and fails CI.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci(deps)"
