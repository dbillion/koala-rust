[package]
name = "peabrain-rust"
version = "0.2.0"
edition = "2021"
description = "PeaBrain MCP Server in Rust - Persistent memory, vector search, multi-agent sync, embeddings, plugins"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }
dirs = "5.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "json", "uuid", "chrono"] }
ndarray = "0.16"
rand = "0.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# v0.2: Vector search (sqlite-vec extension loaded at runtime)
# v0.3: Multi-agent sync (CRDT)
automerge = "0.3"
automerge_repo = "0.1"

# v0.4: Embeddings
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = "0.19"
hf-hub = "0.5"

# v0.5: Plugin system
wasmtime = "25.0"
wasmtime-wasi = "25.0"
libloading = "0.8"

# Utilities
dashmap = "5.0"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"

[target.'cfg(not(windows))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

# v0.5: Plugin marketplace
reqwest = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
wat = "1.0"

[build-dependencies]
wat = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

# Additional profile settings for benchmarking
[profile.bench]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = false
debug = true

[[bin]]
name = "test_load_wasm"
path = "test_load_wasm.rs"
