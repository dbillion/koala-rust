[package]
name = "peabrain-rust"
version = "0.3.0"
edition = "2021"
description = "PeaBrain MCP Server in Rust - Persistent memory, vector search, multi-agent sync, plugins"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dbillion/peabrain-rust"
homepage = "https://github.com/dbillion/peabrain-rust"
keywords = ["mcp", "memory", "sqlite", "crdt", "wasm"]
categories = ["command-line-utilities", "database", "embedded", "wasm"]
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE", "build.rs", "plugins/**/*"]
rust-version = "1.81"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }
clap-mcp = "0.1"
dirs = "5.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "json", "uuid", "chrono"] }
ndarray = "0.16"
rand = "0.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# v0.2: Vector search (sqlite-vec extension loaded at runtime)
# v0.3: Multi-agent sync (CRDT)
automerge = "0.3"
automerge_repo = "0.1"

# v0.4: Real Embeddings (Model2Vec - static token lookup, no neural net)
model2vec-rs = "0.4"
tokenizers = "0.19"

# v0.5: Plugin system
wasmtime = "25.0"
wasmtime-wasi = "25.0"
libloading = "0.8"

# Utilities
dashmap = "5.0"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"

# v0.5: Plugin marketplace (needed on all targets, including Windows)
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
hex = "0.4"

# Vendored OpenSSL keeps Linux/macOS builds self-contained; Windows uses the
# native TLS stack, so it is excluded there.
[target.'cfg(not(windows))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
wat = "1.0"

[build-dependencies]
wat = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

# Additional profile settings for benchmarking
[profile.bench]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = false
debug = true

# Optimize for size when needed
# [profile.release.size]  # Disabled - not a valid cargo profile
# opt-level = "z"
# lto = "thin"

# Binary
[[bin]]
name = "peabrain-rust"
path = "src/main.rs"
