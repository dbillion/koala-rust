[package]
name = "peabrain-rust"
version = "0.2.0"
edition = "2021"
description = "PeaBrain MCP Server in Rust - Persistent memory, vector search, multi-agent sync, plugins"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dbillion/peabrain-rust"
homepage = "https://github.com/dbillion/peabrain-rust"
keywords = ["mcp", "memory", "sqlite", "crdt", "wasm"]
categories = ["command-line-utilities", "database", "embedded", "wasm"]
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE", "build.rs", "plugins/**/*"]
rust-version = "1.81"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }
clap-mcp = "0.1"
dirs = "5.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "json", "uuid", "chrono"] }
ndarray = "0.16"
rand = "0.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# v0.2: Vector search (sqlite-vec extension loaded at runtime)
# v0.3: Multi-agent sync (CRDT)
automerge = "0.3"
automerge_repo = "0.1"

# v0.4: Real Embeddings (Model2Vec - static token lookup, no neural net)
model2vec-rs = "0.4"
tokenizers = "0.19"

# v0.5: Plugin system
wasmtime = "25.0"
wasmtime-wasi = "25.0"
libloading = "0.8"

# Utilities
dashmap = "5.0"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"

# v0.5: Plugin marketplace
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
wat = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

# Additional profile settings for benchmarking
[profile.bench]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = false
panic = "abort"
debug = true

# Optimize for size when needed
# [profile.release.size]  # Disabled - not a valid cargo profile
# opt-level = "z"
# lto = "thin"

# Binary
[[bin]]
name = "peabrain-rust"
path = "src/main.rs"

# BeautifulRust lint configuration
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
exhaustive_enums = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
