[package]
name = "koala-rust"
version = "0.2.0"
edition = "2021"
description = "Koala MCP Server in Rust - Persistent memory, vector search, multi-agent sync, plugins"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dbillion/koala-rust"
homepage = "https://github.com/dbillion/koala-rust"
keywords = ["mcp", "memory", "sqlite", "crdt", "wasm", "plugins", "vector-search"]
categories = ["command-line-utilities", "database", "embedded", "wasm"]
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE", "build.rs", "plugins/**/*"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }
dirs = "5.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "json", "uuid", "chrono"] }
ndarray = "0.16"
rand = "0.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# v0.2: Vector search (sqlite-vec extension loaded at runtime)
# v0.3: Multi-agent sync (CRDT)
automerge = "0.3"
automerge_repo = "0.1"

# v0.4: Embeddings
candle-core = { version = "0.8", default-features = false, features = [] }
candle-nn = { version = "0.8", default-features = false }
candle-transformers = { version = "0.8", default-features = false }
tokenizers = "0.19"
hf-hub = "0.5"

# v0.5: Plugin system
wasmtime = "25.0"
wasmtime-wasi = "25.0"
libloading = "0.8"

# Utilities
dashmap = "5.0"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"

# v0.5: Plugin marketplace
reqwest = "0.12"
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
wat = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

# Additional profile settings for benchmarking
[profile.bench]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = false
panic = "abort"
debug = true

# Optimize for size when needed
[profile.release.size]
opt-level = "z"
lto = "thin"

# Binary
[[bin]]
name = "koala-rust"
path = "src/main.rs"
